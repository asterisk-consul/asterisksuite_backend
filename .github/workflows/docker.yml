name: Build & Push Backend

on:
  push:
    branches: [dev]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/asterisk-consul/asterisksuite-backend:latest
            ghcr.io/asterisk-consul/asterisksuite-backend:dev
            ghcr.io/asterisk-consul/asterisksuite-backend:dev-${{ github.sha }}
