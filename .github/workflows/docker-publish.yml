name: Build and push Docker image

on:
  push:
    branches:
      - maxi_alona
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Paquete propio de este importador (no reusar el de asterisksuite_backend)
  IMAGE_NAME: asterisksuite-importer

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image ref
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_REF=${REGISTRY}/${OWNER}/${IMAGE_NAME}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REF }}:latest
            ${{ env.IMAGE_REF }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Dokploy deploy
        run: |
          echo "Disparando deploy en Dokploy..."
          curl -fsS -X POST "https://panel.asterisksuite.cloud/api/deploy/uMGBCpjMmO3LBHL4-04nC"
