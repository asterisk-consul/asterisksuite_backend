allowBuilds:
  '@nestjs/core': true
  '@prisma/engines': true
  '@scarf/scarf': false
  bcrypt: true
  # Optimización nativa opcional de ssh2. En Alpine requiere compilador;
  # ssh2 utiliza automáticamente su implementación JavaScript si se omite.
  cpu-features: false
  esbuild: true
  prisma: true
  puppeteer: true
  ssh2: true
  unrs-resolver: true
